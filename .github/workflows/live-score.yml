name: Live score

# Refreshes data/live.json. GitHub's scheduler often runs late, so expect
# updates every 15 to 30 minutes rather than exactly on the mark.
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-score
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch her current line
        run: node scripts/update-live.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet -- data/live.json; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name "live-score-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/live.json
          git commit -m "Update live score"
          git pull --rebase --autostash
          git push
